# Локальный PostgreSQL для разработки: docker compose up -d
# DATABASE_URL=postgresql://bot:bot@127.0.0.1:5432/antispam
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: antispam
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
